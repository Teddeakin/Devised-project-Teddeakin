<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="main.js" defer></script>
</head>

<body>
    <header>
        <div class="headerLeft">
            <button id="menuToggle" class="menuButton" aria-label="Open menu">☰</button>
            <h1 class="siteTitle">Account Input</h1>
        </div>

        <div class="headerRight">
            <a class="headerLinkButton" href="Recomendation.html">Recomendation Page</a>
        </div>
    </header>

    <div id="menuOverlay" class="menuOverlay"></div>

    <aside id="sideMenu" class="sideMenu">
        <div class="sideMenuHeader">
            <h2>Navigation</h2>
            <button id="menuClose" class="menuCloseButton" aria-label="Close menu">x</button>
        </div>

        <nav class="sideNav">
            <div class="navGroup">
                <a class="primaryLink" href="">Home</a>
                <div class="subLinks">
                    <a href="#Steam">Steam</a>
                    <a href="#Xbox">Xbox</a>
                    <a href="#Playstation">Playstation</a>
                    <a href="#Merge">Merge</a>
                </div>
            </div>

            <div class="navGroup">
                <a class="primaryLink" href="Recomendation.html">Recommendation</a>
                <div class="subLinks">
                    <a href="Recomendation.html#Weighted">Weighted</a>
                    <a href="Recomendation.html#KNN">KNN</a>
                    <a href="Recomendation.html#RandomWalk">Random Walk</a>
                </div>
            </div>
        </nav>
    </aside>
    
    <main>
        <section id="Accounts">

            <section class="accountBoxes" id="Steam">
                <div class="BoxTitle">
                    <img src="styles/Assets/SteamICON.png" alt="">
                    <h2>Steam input</h2>
                </div>

                <div class="accountControls">
                    <input type="text" id="SteamIdInput" placeholder="Enter SteamID64">
                    <button id="SteamSearchBtn">Search steam</button>
                    <button id="SteamDeleteBtn">X</button>
                </div>

                <details class="DropdownLibrary">
                    <summary>View Steam library</summary>
                    <div class="libraryContent">
                        <p id="Steam-info"></p>
                    </div>
                </details>
            </section>

            <section class="accountBoxes" id="Xbox">
                <div class="BoxTitle">
                    <img src="styles/Assets/XboxICON.png" alt="">
                    <h2>Xbox input</h2>
                </div>

                <div class="accountControls">
                    <input type="text" id="XboxGamertagInput" placeholder="Enter Xbox gamertag">
                    <button id="XboxSearchBtn">Search xbox</button>
                    <button id="XboxDeleteBtn">X</button>
                </div>

                <details class="DropdownLibrary">
                    <summary>View Xbox library</summary>
                    <div class="libraryContent">
                        <p id="Xbox-info"></p>
                    </div>
                </details>
            </section>

            <section class="accountBoxes" id="Playstation">
                <div class="BoxTitle">
                    <!-- get a lighter img -->
                    <img src="styles/Assets/PlaystationICON.png" alt="">
                    <h2>Playstation input</h2>
                </div>

                <div class="accountControls">
                    <input type="text" id="PlaystationUserIdInput" placeholder="Enter Playstation account Id">
                    <button id="PlaystationSearchBtn">Search Playstation</button>
                    <button id="PlaystationDeleteBtn">X</button>
                </div>

                <details class="DropdownLibrary">
                    <summary>View Playstation library</summary>
                    <div class="libraryContent">
                        <p id="Playstation-info"></p>
                    </div>
                </details>
            </section>

            <section class="accountBoxes" id="Merge">
                <div class="BoxTitle">
                    <h2>Merged library</h2>
                </div>

                <div class="accountControls">
                    <button id="MergeGamesBtn">Merge</button>
                </div>

                <details class="DropdownLibrary">
                    <summary>View merged games</summary>
                    <div class="libraryContent">
                        <p id="Merged-info"></p>
                    </div>
                </details>
            </section>

        </section>
    </main>

</body>

</html>
