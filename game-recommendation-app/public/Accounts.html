<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>account page</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="main.js" defer></script>
</head>

<body>
    <header>
        <h1>
            account input
        </h1>
        <a href="Library.html">library page</a>
    </header>

    <main>
        
        <section class="Steam">
            <h2>
                Steam input
            </h2>

            <input type="text" id="SteamIdInput" placeholder="Enter SteamID64">
            <button id="SteamSearchBtn">Search steam</button>
            <button id="SteamDeleteBtn">X</button>

            <p id="Steam-info"> </p>
        </section>
        <section class="Xbox">
            <h2>
                Xbox input
            </h2>

            <input type="text" id="XboxGamertagInput" placeholder="Enter Xbox gamertag">
            <button id="XboxSearchBtn">Search xbox</button>
            <button id="SteamDeleteBtn">X</button>

            <p id="Xbox-info"> </p>
        </section>
        <section class="Playstation">
            <h2>
                Playstation input
            </h2>

            <input type="text" id="PlaystationUserIdInput" placeholder="Enter Playstation account Id">
            <button id="PlaystationSearchBtn">Search Playstation</button>
            <button id="SteamDeleteBtn">X</button>

            <p id="Playstation-info"> </p>
        </section>
        <section class="Merge">
            <button id="MergeGamesBtn">Merge</button>
            <p id="Merged-info"></p>
            <button id="SendPythonBTN">Weighted Algorithm</button>
            <p id="Python-responce"></p>
            <button id="KNNAlgorithm">KNN Algorithm - Cosine</button>
            <p id="KNN-responce"></p>
            <button id="KNNAlgorithm2">KNN Algorithm - Euclidean</button>
            <p id="KNN-responce2"></p>
        </section>
    </main>

</body>

</html>
