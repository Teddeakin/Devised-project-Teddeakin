<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendation page</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js" charset="utf-8"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="Algorithm.js" defer></script>
</head>
<body>
    <main>
        <section id="Algorithms">
            <section id="WeightedLinearSection">
                <button id="SendPythonBTN">Weighted Algorithm</button>
                <p id="Python-responce"></p> <!-- need to change the names of these -->
                <canvas id="WeightedLinearChart"></canvas>
                <div id="WeightedDetailsPanel"></div>
            </section>
            <section id="KNNSection">
                <button id="KNNAlgorithm">KNN Algorithm - Cosine</button>
                <p id="KNN-responce"></p>
                <canvas id="CosineChart"></canvas>
                <div id="AdjacencyGrid" style="width:100%; height:600px; background: #1a1a1a;"></div>
                <button id="KNNAlgorithm2">KNN Algorithm - Euclidean</button>
                <p id="KNN-responce2"></p>
                <canvas id="EuclideanChart"></canvas>
            </section>
            <section id="RandomWalkSection">
                <button id="RandomWalk">Random Walk</button>
                <p id="RandomWalk-Response"></p>
                <div style="margin: 10px 0; color: rgb(0, 0, 0);">
                    <span
                        style="display:inline-block; width:12px; height:12px; background:#FFD700; border-radius:50%; margin-right:6px;"></span>
                    Owned
                    <span
                        style="display:inline-block; width:12px; height:12px; background:#00FFFF; border-radius:50%; margin:0 6px 0 18px;"></span>
                    Recommended
                    <span
                        style="display:inline-block; width:12px; height:12px; background:#888888; border-radius:50%; margin:0 6px 0 18px;"></span>
                    Support
                </div>
                <div id="RandomWalkGraph"
                    style="width: 100%; height: 650px; border: 1px solid #444; border-radius: 8px; background: #111;">
                </div>
                <div id="RandomWalkDetails"
                    style="margin-top: 16px; padding: 14px; border: 1px solid #444; border-radius: 8px; background: #111; color: white;">
                </div>
            </section>
        </section>
    </main>
</body>
</html>
